        opex: 1800
        lead_time_rounds: 1
        availability_modifier: 0.95
        staff_load_modifier: 1.0
      cloud:
        capex: 25000
        opex: 6200
        lead_time_rounds: 0
        availability_modifier: 1.0
        staff_load_modifier: 0.7
      saas:
        capex: 0
        opex: 8000
        lead_time_rounds: 0
        bypasses_platform: true
        availability_modifier: 1.05
        staff_load_modifier: 0.3
    capacity_pct: 100
    staff_load: 0.4
    provenance:
