support_tiers:
  # Two different provenances live on each row and they are kept apart deliberately (finding
  # 1.3-RA-001). `cost` and the tier identity are HARVESTED: maintenance_support_levels.
  # cost_value, carried exactly. `fte_equivalent` is NOT harvested -- the source table has no
  # FTE, staffing or hours column (only cost_value, min_value, max_value, description), so
  # every FTE figure below is an authored estimate and is marked for 1.7 to calibrate. It is
  # load-bearing, not decorative: preferences/services.yaml rests `it`'s strongest view on it
  # (premium 2.4 FTE against a 2.0 starting pool), which is exactly why each value carries its
  # own rationale and its own marker rather than a single file-level statement.
  - key: basic
    cost: 20000
    fte_equivalent: 0.6
    provenance:
      source: HARVESTED
      note: >-
        mis_lite maintenance_support_levels row 1, Basic Support, cost_value 20000 carried
        exactly. fte_equivalent 0.6 is an AUTHORED estimate, not harvested: "essential
        maintenance and limited troubleshooting" (the source description) is business-hours
        cover that absorbs a little over half of one full-time person's support load.
        TODO: calibrate -- mis_lite has no FTE column; owner 1.7.
  - key: standard
    cost: 50000
    fte_equivalent: 1.4
    provenance:
      source: HARVESTED
      note: >-
        mis_lite maintenance_support_levels row 2, Standard Support, cost_value 50000 carried
        exactly. fte_equivalent 1.4 is an AUTHORED estimate, not harvested: "24/7 support with
        proactive system monitoring" is roughly one and a half full-time equivalents once
        out-of-hours cover is included, and sits above basic by the same order the cost does.
        TODO: calibrate -- mis_lite has no FTE column; owner 1.7.
  - key: premium
    cost: 100000
    fte_equivalent: 2.4
    provenance:
      source: HARVESTED
      note: >-
        mis_lite maintenance_support_levels row 3, Premium Support, cost_value 100000 carried
        exactly. fte_equivalent 2.4 is an AUTHORED estimate, not harvested: a "dedicated
        support team with priority issue resolution" is more than two full-time equivalents,
        set just above the 2.0 starting_staff_fte pool so the premium tier alone more than
        covers it -- the figure preferences/services.yaml's `it` view turns on.
        TODO: calibrate -- mis_lite has no FTE column; owner 1.7.

