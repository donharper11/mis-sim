# `events` is not a name map: it holds the persona's message, in their voice.
events:
  event_inventory_numbers: The auditors asked how we know our inventory numbers are right. I did not have an answer.
  event_tablets_arrived: My crew found out about the new system when the tablets arrived.
  event_pos_support_ending: Support for your point-of-sale version ends in one round.
  event_ransomware_demand: Someone has locked the finance systems and is asking to be paid. We are running the close on paper.
  event_customer_records_exposed: A customer rang to ask why a company she has never heard of has her shopping history.
  event_staff_accounts_phished: Fourteen staff clicked the same email this week. Two of them typed their password in.
  event_privacy_regulator_letter: The regulator has written asking how long we keep customer records and who can read them. We have fourteen days.
  event_audit_deadline_missed: We will not have the numbers by the deadline. Last year that cost us a fine and a paragraph in the annual report.
  event_unlogged_change: Something changed in the ordering system on Tuesday night and nobody can tell me who did it.
  event_checkout_queues: Saturday queues are running eight minutes longer than last month and customers are walking out.
  event_service_backlog: We are closing fewer tickets than we open. The oldest one is nineteen days old.
  event_supplier_portal_request: Three of our suppliers want to see stock levels themselves instead of phoning us every morning.
  event_board_wants_numbers: The board wants to know which customers we are losing and why. I cannot answer that from what we hold.

