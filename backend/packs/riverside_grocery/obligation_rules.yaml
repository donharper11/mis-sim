# CG-5 -- the privacy layer's rules. Authored into the section 1.5 spec section 5.4
# specifies and docs/casepack-schema.md documents; no second shape is designed here.
#
# An obligation connects a policy switch to a consequence. A sensitive entity held under a
# permissive policy raises on the SAME ledger as a capacity signal, at `critical`, because
# an obligation is presence-shaped by construction: the condition holds or it does not
# (1.5 decision 10). While it stays open it arms the events in `arms`. There is no parallel
# ethics subsystem and no second scoring path -- that is 1.5 decision 7 paying for itself.
#
# `permissive_value` is the state of the switch when the team has NOT taken a position. It
# is what makes the ethics layer cost something to ignore rather than something to opt into.
#
# DEFERRED CHECK -- no validator code reads this file (finding 1.2-037). `grep -n
# obligation backend/app/casepack/validate.py` returns zero, so a fully orphaned file
# validates identically to a correct one. Every `entity`, `policy` and `arms` key below was
# cross-checked by hand against entities.yaml, policies.yaml and events.yaml; that
# cross-check is pasted in handoffs/1.3-harvest/dod.md section 10 and stands in for the
# machine check until 1.2 builds it.

- key: customer_pii_retention
  entity: customer
  condition: policy_permits
  policy: data_retention
  permissive_value: indefinite
  severity: critical
  cleared_by: [add_policy, retire_component]
  arms: [privacy_regulator_letter]
  provenance:
    source: AUTHORED
    note: >-
      Ch 4 privacy layer. Customer records are the pack's only `high` sensitivity entity a
      student touches every round, and retention left open is the classic exposure. Cleared
      by taking a retention position, or by retiring the component that holds the history.

- key: customer_pii_collection
  entity: customer
  condition: policy_permits
  policy: data_collection
  permissive_value: everything_by_default
  severity: critical
  cleared_by: [add_policy, retire_component]
  arms: [privacy_regulator_letter, crm_data_exposed]
  provenance:
    source: AUTHORED
    note: >-
      The half of privacy that is not about protecting what you hold but about not holding
      it. A firm that collects everything by default has more to lose in exactly the
      incident `crm_data_exposed` describes.

- key: sale_detail_open_to_all_staff
  entity: sale
  condition: policy_permits
  policy: data_access
  permissive_value: open_to_all_staff
  severity: critical
  cleared_by: [add_policy, add_service_tier]
  arms: [crm_data_exposed]
  provenance:
    source: AUTHORED
    note: >-
      0.4 security screen: "4 separate logins · no record of who views customer data".
      Individual transactions readable by all 620 staff is the access dimension left open.
      Cleared by an access position or by the central sign-on service tier that can enforce
      one.

- key: user_account_changes_unlogged
  entity: user_account
  condition: policy_permits
  policy: access_logging
  permissive_value: unlogged
  severity: critical
  cleared_by: [add_policy, add_service_tier]
  arms: [unlogged_system_change]
  provenance:
    source: AUTHORED
    note: >-
      Harvested consequence: mis_lite regulatory_penalties row 3 fines the firm 30000 for
      "unauthorized system change without proper logging". This is the obligation that
      makes that penalty reachable rather than decorative.

- key: ledger_egress_unrestricted
  entity: ledger
  condition: policy_permits
  policy: data_egress
  permissive_value: unrestricted
  severity: critical
  cleared_by: [add_policy, upgrade_component]
  arms: [financial_audit_deadline_missed]
  provenance:
    source: AUTHORED
    note: >-
      Accounts are `high` sensitivity and the close depends on extracts moving between
      systems. With no egress position, an auditor cannot say where the numbers went, which
      is the same failure mis_lite priced at 80000 under SOX.

- key: staff_activity_untracked
  entity: user_account
  condition: policy_permits
  policy: staff_monitoring
  permissive_value: untracked
  severity: critical
  cleared_by: [add_policy, add_training]
  arms: [phishing_on_staff_accounts]
  provenance:
    source: AUTHORED
    note: >-
      The obligation that cuts the other way, and the reason `staff_monitoring` is the one
      switch whose effect vector has a negative term for the firm's own people. Leaving
      staff activity untracked arms the phishing card; tracking it costs employee trust.
      A student should not be able to answer this one for free in either direction.
