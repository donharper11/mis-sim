  reopen_cost: 80000
  harvested_raw_fit:
    order_fulfilment: 1.073
    store_operations: 1.113
    financial_reporting: 1.047
    customer_insight: 1.087
    marketing_sales: 1.150
    service: 1.150
    firm_infrastructure: 1.033
  provenance:
    source: AUTHORED
    note: >-
      Identity harvested from mis_lite strategy row 2, "Emphasize unique products and
      customer experience". Weights authored against that description and against the
      capabilities the case actually has; the harvested normalisation is recorded above
      and in PROVENANCE.md but is not used, for the reason stated at the head of this file.
      firm_infrastructure carries 0.06 in every strategy: it is a support activity, so it
      never leads, but a strategy that weights it at zero says the platform can fail
      without cost.

