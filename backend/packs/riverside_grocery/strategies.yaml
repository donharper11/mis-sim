# Identity harvested from mis_lite `strategy` (4 rows, mechanical -- the four are exactly
# the four this design uses). Weights are the judged part, and the judgement is stated.
#
# THE FIT-MULTIPLIER CONVERSION (spec section 3 decision 4, CONTRACTS.md).
# `component_strategy_fit` holds 168 un-normalised multipliers around 1.0, per component
# per strategy. 72 of those cells belong to components on design/01 section 3's buildable
# list. The conversion is: map each buildable component to the capability it serves, take
# the mean multiplier per (strategy, capability), then normalise per strategy to sum 1.0.
# `harvested_raw_fit` below holds the per-capability RAW means, before normalisation, as
# the schema intends (docs/casepack-schema.md: "Raw source multipliers retained as
# provenance"). Raw values never reach `capability_weights` -- CONTRACTS.md forbids mixing
# the two schemes.
#
# THE CONVERSION RAN, AND ITS OUTPUT IS NOT USED FOR THE WEIGHTS. Normalising multipliers
# that all sit inside [0.91, 1.40] puts every weight inside [0.132, 0.152] for every
# strategy -- a spread of 1.5 percentage points across seven capabilities and four
# strategies. Two consequences, both fatal to the strategy layer:
#
#   * all four strategies become numerically indistinguishable, so a team's declaration
#     would change almost nothing and 1.7 could not calibrate against it;
#   * cost_leadership's multiplier is the HIGHEST of the four for all seven capabilities
#     (1.27-1.36 against differentiation's 1.03-1.15), which is a scale artefact of the
#     source, not a statement that cost leadership benefits more from everything.
#
# The full normalised table is in PROVENANCE.md so the next reader can check the arithmetic
# rather than take this on trust. Reversible: if 1.7's harness shows the authored weights
# are wrong, the harvested table is one table away.

- key: cost_leadership
  headline_metric: cost_per_transaction
  capability_weights:
    order_fulfilment: 0.35
    store_operations: 0.30
    financial_reporting: 0.09
    firm_infrastructure: 0.06
    customer_insight: 0.10
    marketing_sales: 0.10
  expected_concentration: 0.28
  target_rgt_mix: {run: 0.45, grow: 0.40, transform: 0.15}
  # TODO:calibrate (owner 1.7) — RULING #1 (user 2026-08-22): raised 0.15 -> 0.30 to make
  # underfunded maintenance ("buy everything, skip the upkeep") bite the Overspender's
  # portfolio_discipline harder so Balanced leads more clearly. Cost leadership lives on a
  # reliably-maintained low-cost estate, so a 30% run/maintenance floor is defensible; the
  # value is a first guess. HARD CEILING 0.3223 — the 1.4 pin's maintenance ratio is 0.32231,
  # clamped to score 1.0; any floor above that drops the pin's maintenance_score and moves the
  # frozen pin. 0.30 keeps the pin's maintenance_score clamped at 1.0 (0.32231/0.30 = 1.07).
  maintenance_floor_pct: 0.30
  punishes: overprovisioning
  reopen_cost: 80000
  harvested_raw_fit:
    order_fulfilment: 1.330
    store_operations: 1.320
    financial_reporting: 1.330
    customer_insight: 1.287
    marketing_sales: 1.270
    service: 1.320
    firm_infrastructure: 1.355
  provenance:
    source: PINNED
    note: >-
      mis_lite strategy row 1, "Focus on low-cost production and operations". The weights
      are PINNED by mockups/strategy.html, which displays them by VALUE-CHAIN ACTIVITY:
      "Outbound logistics 0.35 · Operations 0.30 · Firm infrastructure 0.15 · Customer
      insight 0.10 · Marketing & sales 0.10". Two capabilities sit at
      support/firm_infrastructure -- financial_reporting and firm_infrastructure -- so the
      0.15 the screen shows is their sum. 1.3 splits it 0.09 / 0.06 rather than 0.15 / 0.00.
      The displayed line is unchanged; what changes is that firm_infrastructure stops being
      a capability no strategy has any reason to invest in (W02), which is not a defensible
      thing to say about the platform everything else runs on.

