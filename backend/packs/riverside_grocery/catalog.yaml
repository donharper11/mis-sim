# LEAD TIMES -- re-authored by the 1.3 follow-up. The band is in PROVENANCE.md section 10.
#
# 54 of the pack's 75 placement options completed in zero rounds, so *follow-through* -- a
# named Management sub-factor with a UI and a casepack field -- had almost nothing to act
# on, and "started five things, finished none" was an impossible failure rather than a
# teachable one (design/07 section 4).
#
# The band, in one line each:
#   0  already running, or nothing to install and nobody to retrain
#   1  a departmental application: procure, configure, integrate, cut one department over
#   2  touches every store, the warehouse or the ledger: migration plus parallel running
#
# Anchored on mis_lite `mis_initiatives_master.duration_in_rounds` (12 rows, range 1-5):
# BI dashboard 1 · CRM enhancements 1 · ERP finance module 2 · data migration 3. The
# source has NO initiative shorter than one round, which is the strongest single argument
# that 54 zeroes was a content defect rather than a modelling choice.
#
# Placement changes the answer only where the delay was infrastructure. `saas` rows carry
# `bypasses_platform: true` -- the firm does not build the platform underneath them -- so
# SaaS is one round faster than the same item on-premises where that build was the wait,
# and no faster at all where the wait is migration, training or process change. Note that
# mis_lite's own data does NOT support a general "cloud is faster" rule: its four cloud
# initiatives average 2.75 rounds against 2.0 for its two on-premises ones, so the
# gradient here is authored and marked.
#
# ONLY THE ZEROES WERE RE-AUTHORED. The 21 rows that already carried 1 or 2 are untouched,
# including the ones 0.3 section 5.6 pins.
#
# The 17 rows still at 0 are deliberate, and each is a case where zero is the honest
# answer: the two incumbent on-premises systems the firm already runs (`pos_system_2011`,
# `accounting_package`, both at capex 0), the store spreadsheets, the back-office PC, and
# the three subscribed services that start working when the invoice is signed.
# TODO: calibrate -- the whole band. 1.7's harness moves it.

