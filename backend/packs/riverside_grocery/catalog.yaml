# --------------------------------------------------------------------------------------
# 1.3 harvest -- items added from mis_lite `component_types_master` (the buildable half,
# design/01 section 3) and from the COMPONENTS table pinned in 0.3 section 5.6.
#
# The first two close a gap between the pinned mockups and the pack: 0.3 section 5.6 lists
# six components at unit level and the pack carried four of them.
#
# ERP modules (21 rows), e-commerce features (9 rows) and MIS initiatives (12 rows) are
# NOT one catalog row each. In mis_lite they are LEVELS within a single decision -- a team
# sets an adoption level per module, and `erp_modules_master` is literally a family x
# Basic/Mid/Advanced ladder. The new schema expresses a level as `config_tiers` on a
# catalog item, so that is where they land. Forty-two extra shopping-list rows would also
# be the thing GOVERNANCE section 2 names first among what this must not feel like.
# --------------------------------------------------------------------------------------

