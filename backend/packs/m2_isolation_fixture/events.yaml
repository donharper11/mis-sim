# CG-2 -- every strategy must be drawn by at least six cards (1.5 section 5.2a, W08 at N=6).
#
# Before 1.3 the deck was three cards and the draws were cost_leadership 3,
# customer_supplier_intimacy 2, differentiation 1, focus_strategy 1. Two of the three cards
# waited on a severity their watch rule could never reach, so the effective deck was ONE.
#
# THE TRAP, and why this file does not fall into it (finding 1.2-035): an event with an
# empty `strategy_affinity` is dealt to everybody, so emptying the field on every card
# satisfies W08 instantly -- and trades one W08 for seven W03, because a card that fires
# whatever the team declared is a card the strategy layer cannot teach with. Every card
# below names its strategies explicitly, and names them because the pressure genuinely
# lands on that strategy.
#
# Round timing stays emergent. `Event` carries no round field and never will (1.5 decision
# 9): a card fires when its preconditions are true, never on a calendar. The `round_id`
# column on mis_lite's `security_incidents` and `regulatory_penalties` is therefore NOT
# harvested -- it is exactly the second timing system that ruling forbids.

