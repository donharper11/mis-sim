# Stakeholder preferences on where the firm's platform runs.
#
# MECHANICAL HARVEST of mis_lite `stakeholder_infrastructure_preference` (14 rows = the 7
# internal stakeholders x 2 infrastructure types) joined to `it_infrastructure_types`
# (1 = Cloud, 2 = On-Prem). `cloud_weight` and `on_prem_weight` below are the source's
# `preference_weight` values carried EXACTLY; `ideal_placement` is derived from them --
# whichever is higher, or `no_preference` where the two are equal.
#
#   stakeholder                cloud   on_prem   ideal_placement
#   Senior Management/C-Suite   1.2      0.7     cloud
#   Finance                     1.1      0.8     cloud
#   Employees                   1.0      1.0     no_preference
#   Operations                  0.7      1.2     on_prem
#   IT Department               0.7      1.3     on_prem
#   HR                          1.0      1.0     no_preference
#   Marketing                   1.3      0.8     cloud
#
# CORRECTION, and it is worth naming. Before this harvest the file asserted
# `finance: {ideal_placement: on_prem}`. The source says the opposite -- finance weights
# cloud 1.1 against on-premises 0.8, which is the intuitive reading too: finance likes not
# owning the asset. That value had been authored, not harvested, and nothing had checked it.
#
# `weight` is how much this archetype's view counts, and it is AUTHORED -- mis_lite has no
# equivalent, because in its model every stakeholder counted the same.
#
# The seven external archetypes have no rows in the source (the table is internal only), so
# their entries are authored and say so.

defaults_by_archetype:
  # --- internal seven, harvested exactly ---
  c_suite: {ideal_placement: cloud, cloud_weight: 1.2, on_prem_weight: 0.7, weight: 0.8}
  finance: {ideal_placement: cloud, cloud_weight: 1.1, on_prem_weight: 0.8, weight: 0.9}
  employees: {ideal_placement: no_preference, cloud_weight: 1.0, on_prem_weight: 1.0, weight: 0.5}
  operations: {ideal_placement: on_prem, cloud_weight: 0.7, on_prem_weight: 1.2, ideal_availability: high, weight: 0.8}
  it: {ideal_placement: on_prem, cloud_weight: 0.7, on_prem_weight: 1.3, ideal_staff_load: low, weight: 0.8}
  hr: {ideal_placement: no_preference, cloud_weight: 1.0, on_prem_weight: 1.0, weight: 0.5}
  marketing: {ideal_placement: cloud, cloud_weight: 1.3, on_prem_weight: 0.8, weight: 0.6}
  # --- external seven, authored: no source rows exist ---
  investor: {ideal_cost_posture: low, weight: 0.7}
  customer: {ideal_availability: high, weight: 0.8}
  vendor: {ideal_integration: high, weight: 0.7}
  security_auditor: {ideal_identity_access: high, weight: 0.9}
  regulator: {ideal_recovery: high, weight: 0.8}
  general_public: {ideal_privacy: high, weight: 0.8}
  media: {ideal_incident_visibility: low, weight: 0.6}

overrides:
  - {item: backup_recovery, archetype: security_auditor, ideal_value: 95, weight: 1.0}
  - {item: central_sign_on, archetype: security_auditor, ideal_value: 90, weight: 1.0}

provenance:
  source: HARVESTED
  note: >-
    mis_lite stakeholder_infrastructure_preference, 14 rows, joined to
    it_infrastructure_types. Preference weights carried exactly; the `weight` column and
    the seven external archetypes are authored, because the source has neither.
    TODO: calibrate -- the `weight` column is authored judgement throughout.
