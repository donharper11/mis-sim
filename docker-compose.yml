services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mis_sim}
      POSTGRES_USER: ${POSTGRES_USER:-mis_sim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mis_sim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mis_sim} -d ${POSTGRES_DB:-mis_sim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mis_sim:mis_sim@db:5432/mis_sim}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      - db

volumes:
  postgres_data:

